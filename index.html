<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Voyora — your smart travel companion. Discover hidden gems, visa guides, local culture, and AI-powered itineraries." />

    <!-- Open Graph / social share preview. Note: since this is a client-rendered
         SPA (no server-side rendering), these tags are site-wide only — most
         social crawlers (Facebook, Twitter/X, LinkedIn, WhatsApp) fetch the raw
         HTML and don't execute JavaScript, so per-page dynamic previews would
         need SSR or prerendering to work. This gives every shared link a solid
         generic preview instead of none. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Voyora" />
    <meta property="og:title" content="Voyora — Explore Beyond Borders" />
    <meta property="og:description" content="Your smart travel companion. Discover hidden gems, visa guides, local culture, and AI-powered itineraries across 32 destinations." />
    <meta property="og:image" content="/images/paris.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Voyora — Explore Beyond Borders" />
    <meta name="twitter:description" content="Your smart travel companion. Discover hidden gems, visa guides, local culture, and AI-powered itineraries across 32 destinations." />
    <meta name="twitter:image" content="/images/paris.jpg" />
    <title>Voyora — Explore Beyond Borders</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
